html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}

.title{position:absolute;top:16px;left:16px;padding:12px 18px;border-radius:18px;pointer-events:none}
.title h1{font:800 1.5rem Fraunces,Georgia,serif;margin:0}
.title p{margin:2px 0 0;font-size:.8rem;color:var(--mute)}

.card.off{opacity:0;pointer-events:none}
.card h2{font:800 1.5rem Fraunces,Georgia,serif;margin:0 0 8px}
.card dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 10px;font-size:.86rem}
.card dt{color:var(--mute)}.card dd{margin:0;font-weight:500}
.card p{margin:0;font-size:.9rem;line-height:1.5}
.dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(820px,calc(100% - 20px));border-radius:24px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
button{font:500 .88rem "DM Sans",sans-serif;color:var(--ink);background:transparent;border:1px solid var(--edge);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;flex:none}
button:hover{border-color:var(--pop)}
button[aria-pressed="true"]{background:var(--pop);border-color:var(--pop);color:#1a1205;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.lbl{position:absolute;left:0;top:0;font-size:.75rem;color:var(--ink);pointer-events:none;white-space:nowrap;text-shadow:0 1px 4px #000,0 0 8px #000}.wt{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:.85rem;color:var(--mute);flex-wrap:wrap}.wt input{width:68px;background:transparent;color:var(--ink);border:1px solid var(--edge);border-radius:8px;padding:5px 8px;font:inherit}.wt b{color:var(--pop)}.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:.85rem;color:var(--mute)}
.ctl input{flex:1;min-width:60px;accent-color:var(--pop)}
@media (max-width:560px){.card{top:auto;bottom:150px;right:10px;left:10px;width:auto;max-height:34%}.title p{display:none}.ctl label{display:none}}
</style>
</head>
